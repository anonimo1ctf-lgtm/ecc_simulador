<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma ECC | Criptografía de Curvas Elípticas</title>
    
    <!-- Librerías CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.6.2/distrib/jsxgraph.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1" id="nav-title">Plataforma Interactiva ECC</span>
        </div>
    </nav>

    <!-- ================= VISTA 1: ÍNDICE TIPO WIKIPEDIA ================= -->
    <div id="view-index" class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h1 class="mb-4">Criptografía de Curvas Elípticas</h1>
                <p class="lead">Selecciona un tema para explorar la teoría matemática y ejecutar la simulación interactiva.</p>
                
                <div class="list-group shadow-sm">
                    <!-- Tema 1 -->
                    <button type="button" class="list-group-item list-group-item-action p-4" onclick="appRouter.navigateTo('suma')">
                        <h4 class="mb-1 text-primary">1. Fundamentos Matemáticos: Suma de Puntos</h4>
                        <p class="mb-1 text-muted">Aprende cómo se define la suma geométrica y algebraica sobre campos finitos primos.</p>
                    </button>
                    <!-- Tema 2 -->
                    <button type="button" class="list-group-item list-group-item-action p-4" onclick="appRouter.navigateTo('ecdh')">
                        <h4 class="mb-1 text-primary">2. Intercambio de Claves Diffie-Hellman (ECDH)</h4>
                        <p class="mb-1 text-muted">Simula cómo dos entidades derivan una clave secreta compartida en un canal inseguro.</p>
                    </button>
                    <!-- Tema 3 -->
                    <button type="button" class="list-group-item list-group-item-action p-4" onclick="appRouter.navigateTo('elgamal')">
                        <h4 class="mb-1 text-primary">3. Cifrado Asimétrico ElGamal</h4>
                        <p class="mb-1 text-muted">Explora la encriptación y desencriptación de mensajes transformados en puntos de la curva.</p>
                    </button>
                    <!-- Tema 4 -->
                    <button type="button" class="list-group-item list-group-item-action p-4" onclick="appRouter.navigateTo('massey')">
                        <h4 class="mb-1 text-primary">4. Protocolo Massey-Omura</h4>
                        <p class="mb-1 text-muted">Analiza el cifrado de tres pasos sin intercambio previo de claves.</p>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= VISTA 2: ÁREA DE SIMULACIÓN Y TEORÍA ================= -->
    <div id="view-simulator" class="container-fluid mt-3 d-none">
        
        <!-- Botón para regresar al índice -->
        <button class="btn btn-outline-secondary mb-3 ms-2" onclick="appRouter.navigateHome()">
            &larr; Regresar al Índice
        </button>

        <div class="row">
            <!-- PANEL LATERAL (Teoría y Controles) -->
            <div class="col-lg-4 col-md-5 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0" id="panel-title">Parámetros</h5>
                    </div>
                    <div class="card-body" id="panel-content">
                        
                        <!-- Bloque de Teoría Dinámica -->
                        <div id="theory-description" class="mb-4">
                            <!-- El texto descriptivo se inyectará aquí según el tema -->
                        </div>

                        <!-- Formulario Base (Lo reutilizaremos para varios temas) -->
                        <form id="ecc-form">
                            <div class="row mb-3">
                                <div class="col">
                                    <label class="form-label">Coeficiente a</label>
                                    <input type="number" class="form-control" id="param-a" value="-1" required>
                                </div>
                                <div class="col">
                                    <label class="form-label">Coeficiente b</label>
                                    <input type="number" class="form-control" id="param-b" value="1" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Campo Finito p</label>
                                <input type="number" class="form-control" id="param-p" value="17" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Graficar</button>
                        </form>
                        
                        <hr>
                        <div id="theory-output" class="mt-3"></div>
                    </div>
                </div>
            </div>

            <!-- ÁREA CENTRAL (Gráfica JSXGraph) -->
            <div class="col-lg-8 col-md-7 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body p-0">
                        <div id="jxgbox" class="jxgbox" style="width: 100%; height: 80vh; min-height: 500px; border-radius: 0.375rem;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts de Librerías -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/jsxgraph@1.6.2/distrib/jsxgraphcore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/snap.svg/0.5.1/snap.svg-min.js"></script>

    <!-- Módulos personalizados -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
