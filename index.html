<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma ECC | Criptografía de Curvas Elípticas</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.6.2/distrib/jsxgraph.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Plataforma Interactiva ECC</span>
        </div>
    </nav>

    <!-- ================= VISTA 1: ÍNDICE PRINCIPAL ================= -->
    <div id="view-main-index" class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h1 class="mb-4">Criptografía de Curvas Elípticas</h1>
                <p class="lead">Selecciona un módulo para explorar su teoría y simulación.</p>
                
                <div class="list-group shadow-sm">
                    <button class="list-group-item list-group-item-action p-4" onclick="appRouter.navigateToTopic('suma')">
                        <h4 class="mb-1 text-primary">1. Fundamentos: Suma de Puntos</h4>
                    </button>
                    <button class="list-group-item list-group-item-action p-4" onclick="appRouter.navigateToTopic('ecdh')">
                        <h4 class="mb-1 text-primary">2. Protocolo Diffie-Hellman (ECDH)</h4>
                    </button>
                    <button class="list-group-item list-group-item-action p-4" onclick="appRouter.navigateToTopic('elgamal')">
                        <h4 class="mb-1 text-primary">3. Cifrado Asimétrico ElGamal</h4>
                    </button>
                    <button class="list-group-item list-group-item-action p-4" onclick="appRouter.navigateToTopic('massey')">
                        <h4 class="mb-1 text-primary">4. Protocolo Massey-Omura</h4>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= VISTA 2: SUB-ÍNDICE DEL TEMA ================= -->
    <div id="view-topic-index" class="container mt-5 d-none">
        <button class="btn btn-outline-secondary mb-4" onclick="appRouter.navigateHome()">
            &larr; Regresar al Índice Principal
        </button>
        
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h2 id="topic-title" class="mb-4 text-primary">Título del Tema</h2>
                <div id="subtopic-list" class="list-group shadow-sm">
                    <!-- Los subtemas se inyectarán aquí dinámicamente -->
                </div>
            </div>
        </div>
    </div>

    <!-- ================= VISTA 3: CONTENIDO Y SIMULADOR ================= -->
    <div id="view-content" class="container-fluid mt-4 d-none">
        
        <!-- Botones de Navegación -->
        <div class="mb-3 ms-2">
            <button class="btn btn-outline-secondary me-2" onclick="appRouter.navigateHome()">
                Inicio
            </button>
            <button class="btn btn-outline-primary" id="btn-back-topic" onclick="">
                &larr; Regresar al Tema
            </button>
        </div>

        <div class="row">
            <!-- PANEL LATERAL (Teoría y Controles) -->
            <div id="theory-column" class="col-lg-4 col-md-5 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0" id="subtopic-title">Subtema</h5>
                    </div>
                    <div class="card-body">
                        
                        <!-- CONTENIDO TEÓRICO ESTÁTICO (Aquí irá tu texto y LaTeX) -->
                        <div id="static-theory-container" class="mb-4 text-justify">
                            <!-- El contenido en LaTeX se inyectará aquí -->
                        </div>

                        <!-- SIMULADOR (Se ocultará si el subtema es pura teoría) -->
                        <div id="simulator-controls">
                            <hr>
                            <h6 class="text-secondary text-center mb-1">Ecuación de la Curva</h6>
                            
                            <!-- Contenedores para las ecuaciones (se renderizan desde ui.js) -->
                            <div id="formula-static-weierstrass" class="text-muted" style="font-size: 0.9em; margin-bottom: -15px;"></div>
                            <div id="formula-dynamic-weierstrass" class="text-primary mb-3"></div>

                            <form id="ecc-form">
                                <div class="row mb-3">
                                    <div class="col">
                                        <label class="form-label">Coeficiente a</label>
                                        <input type="number" class="form-control" id="param-a" value="-1" required>
                                    </div>
                                    <div class="col">
                                        <label class="form-label">Coeficiente b</label>
                                        <input type="number" class="form-control" id="param-b" value="1" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Campo Finito p</label>
                                    <input type="number" class="form-control" id="param-p" value="17" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Graficar</button>
                            </form>
                            <div id="theory-output" class="mt-3"></div>
                        </div>

                    </div>
                </div>
            </div>

            <!-- ÁREA CENTRAL (Gráfica JSXGraph) -->
            <div class="col-lg-8 col-md-7 mb-4" id="graphic-area">
                <div class="card shadow-sm h-100">
                    <div class="card-body p-0">
                        <div id="jxgbox" class="jxgbox" style="width: 100%; height: 80vh; min-height: 500px; border-radius: 0.375rem;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts de Librerías -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/jsxgraph@1.6.2/distrib/jsxgraphcore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/snap.svg/0.5.1/snap.svg-min.js"></script>

    <!-- Módulo Principal -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
