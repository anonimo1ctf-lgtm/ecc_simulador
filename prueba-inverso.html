
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pruebas matemáticas ECC</title>
</head>
<body>
    <h2>Pruebas de modInverse()</h2>

    <pre id="resultado">Ejecutando pruebas...</pre>

    <script type="module">
        import {
    modInverse,
    isPrime,
    validateCurve,
    findPoints,
    multiplyPoint,
    pointOrder,
    negatePoint,
    addPoints,
    encryptElGamal,
    decryptElGamal,
    simulateMasseyOmura
} from './js/crypto.js';

        const salida = document.getElementById('resultado');

        let aprobadas = 0;
        let total = 0;
        let reporte = '';

        function probar(nombre, prueba) {
            total++;

            try {
                if (prueba()) {
                    aprobadas++;
                    reporte += '✅ CORRECTO: ' + nombre + '\n';
                } else {
                    reporte += '❌ ERROR: ' + nombre + '\n';
                }
            } catch (error) {
                reporte += '❌ ERROR: ' + nombre +
                           ' - ' + error.message + '\n';
            }
        }

        // Prueba 1: inverso en campo primo.
        probar('Inverso de 3 módulo 17', () => {
            return modInverse(3, 17) === 6;
        });

        // Prueba 2: inverso en módulo compuesto.
        probar('Inverso de 3 módulo 14', () => {
            return modInverse(3, 14) === 5;
        });

        // Prueba 3: inverso inexistente.
        probar('El 2 no tiene inverso módulo 14', () => {
            try {
                modInverse(2, 14);
                return false;
            } catch (error) {
                return error instanceof RangeError;
            }
        });

        // Prueba 4: el cero no tiene inverso.
        probar('El 0 no tiene inverso módulo 17', () => {
            try {
                modInverse(0, 17);
                return false;
            } catch (error) {
                return error instanceof RangeError;
            }
        });

// Prueba 5: verificar número primo.
probar('17 es primo', () => {
    return isPrime(17) === true;
});

// Prueba 6: verificar número compuesto.
probar('15 no es primo', () => {
    return isPrime(15) === false;
});

// Prueba 7: curva válida.
probar('Curva válida: a=-1, b=1, p=17', () => {
    return validateCurve(-1, 1, 17) === true;
});

// Prueba 8: campo no primo.
probar('Rechazar campo p=15', () => {
    try {
        validateCurve(-1, 1, 15);
        return false;
    } catch (error) {
        return error instanceof RangeError;
    }
});

// Prueba 9: curva singular.
probar('Rechazar curva singular', () => {
    try {
        validateCurve(0, 0, 17);
        return false;
    } catch (error) {
        return error instanceof RangeError;
    }
});



// Prueba 10: cantidad correcta de puntos.
probar('Curva válida genera 13 puntos', () => {
    const puntos = findPoints(-1, 1, 17);
    return puntos.length === 13;
});

// Prueba 11: rechazar campo compuesto.
probar('findPoints rechaza p=15', () => {
    try {
        findPoints(-1, 1, 15);
        return false;
    } catch (error) {
        return error instanceof RangeError;
    }
});

// Prueba 12: rechazar curva singular.
probar('findPoints rechaza curva singular', () => {
    try {
        findPoints(0, 0, 17);
        return false;
    } catch (error) {
        return error instanceof RangeError;
    }
});


// Prueba 13: orden del punto generador.
probar('Orden de G=(0,1) es 14', () => {
    return pointOrder([0, 1], -1, 1, 17) === 14;
});

// Prueba 14: punto de orden 2.
probar('Orden de P=(12,0) es 2', () => {
    return pointOrder([12, 0], -1, 1, 17) === 2;
});

// Prueba 15: multiplicación por el orden.
probar('14G produce el punto al infinito', () => {
    const resultado = multiplyPoint(
        [0, 1], 14, -1, 17
    );

    return resultado === null;
});

// Prueba 16: rechazar punto fuera de la curva.
probar('Rechazar punto (2,2)', () => {
    try {
        pointOrder([2, 2], -1, 1, 17);
        return false;
    } catch (error) {
        return error instanceof RangeError;
    }
});


// Prueba 17: clave pública de Alice.
probar('ECDH: clave pública de Alice', () => {
    const QA = multiplyPoint([0, 1], 3, -1, 17);
    return QA[0] === 5 && QA[1] === 11;
});

// Prueba 18: clave pública de Bob.
probar('ECDH: clave pública de Bob', () => {
    const QB = multiplyPoint([0, 1], 5, -1, 17);
    return QB[0] === 1 && QB[1] === 16;
});

// Prueba 19: secreto compartido.
probar('ECDH: secretos de Alice y Bob coinciden', () => {
    const G = [0, 1];

    const QA = multiplyPoint(G, 3, -1, 17);
    const QB = multiplyPoint(G, 5, -1, 17);

    const KA = multiplyPoint(QB, 3, -1, 17);
    const KB = multiplyPoint(QA, 5, -1, 17);

    return KA !== null && KB !== null &&
           KA[0] === KB[0] && KA[1] === KB[1] &&
           KA[0] === 0 && KA[1] === 1;
});

// Prueba 20: rechazar escalares incorrectos.
probar('Rechazar escalares decimales y negativos', () => {
    let decimalRechazado = false;
    let negativoRechazado = false;

    try {
        multiplyPoint([0, 1], 3.8, -1, 17);
    } catch (error) {
        decimalRechazado = error instanceof RangeError;
    }

    try {
        multiplyPoint([0, 1], -3, -1, 17);
    } catch (error) {
        negativoRechazado = error instanceof RangeError;
    }

    return decimalRechazado && negativoRechazado;
});


// Prueba 21: punto opuesto.
probar('Opuesto de (0,1) es (0,16)', () => {
    const N = negatePoint([0, 1], 17);
    return N[0] === 0 && N[1] === 16;
});

// Prueba 22: sumar puntos opuestos.
probar('P + (-P) produce el infinito', () => {
    const P = [0, 1];
    const N = negatePoint(P, 17);
    return addPoints(P, N, -1, 17) === null;
});

// Prueba 23: punto con coordenada y=0.
probar('(12,0) es su propio opuesto', () => {
    const N = negatePoint([12, 0], 17);
    return N[0] === 12 && N[1] === 0;
});

// Prueba 24: opuesto del infinito.
probar('El infinito es su propio opuesto', () => {
    return negatePoint(null, 17) === null;
});

// Prueba 25: rechazar coordenadas incorrectas.
probar('Rechazar coordenadas fuera del campo', () => {
    try {
        negatePoint([17, 1], 17);
        return false;
    } catch (error) {
        return error instanceof RangeError;
    }
});


// Prueba 26: cifrado ElGamal correcto.
probar('ElGamal: cifrado produce C1 y C2 correctos', () => {
    const G = [0, 1];
    const Q = multiplyPoint(G, 3, -1, 17);
    const M = [1, 1];

    const { C1, C2 } = encryptElGamal(
        M, G, Q, 2, -1, 1, 17
    );

    return C1[0] === 13 && C1[1] === 14 &&
           C2[0] === 0 && C2[1] === 1;
});

// Prueba 27: rechazar k fuera del rango.
probar('ElGamal: rechazar k=14', () => {
    const G = [0, 1];
    const Q = multiplyPoint(G, 3, -1, 17);

    try {
        encryptElGamal(
            [1, 1], G, Q, 14, -1, 1, 17
        );
        return false;
    } catch (error) {
        return error instanceof RangeError;
    }
});

// Prueba 28: rechazar mensaje fuera de la curva.
probar('ElGamal: rechazar mensaje inválido', () => {
    const G = [0, 1];
    const Q = multiplyPoint(G, 3, -1, 17);

    try {
        encryptElGamal(
            [2, 2], G, Q, 2, -1, 1, 17
        );
        return false;
    } catch (error) {
        return error instanceof RangeError;
    }
});

// Prueba 29: C2 puede ser el punto al infinito.
probar('ElGamal: C2 puede ser infinito', () => {
    const G = [0, 1];
    const Q = multiplyPoint(G, 3, -1, 17);

    const { C1, C2 } = encryptElGamal(
        [3, 12], G, Q, 2, -1, 1, 17
    );

    return C1[0] === 13 &&
           C1[1] === 14 &&
           C2 === null;
});



// Prueba 30: recuperar el mensaje original.
probar('ElGamal: descifrado recupera M', () => {
    const G = [0, 1];
    const d = 3;
    const Q = multiplyPoint(G, d, -1, 17);
    const M = [1, 1];

    const { C1, C2 } = encryptElGamal(
        M, G, Q, 2, -1, 1, 17
    );

    const recuperado = decryptElGamal(
        C1, C2, G, d, -1, 1, 17
    );

    return recuperado !== null &&
           recuperado[0] === M[0] &&
           recuperado[1] === M[1];
});

// Prueba 31: descifrar cuando C2 es infinito.
probar('ElGamal: descifrar C2 infinito', () => {
    const G = [0, 1];
    const d = 3;
    const Q = multiplyPoint(G, d, -1, 17);
    const M = [3, 12];

    const { C1, C2 } = encryptElGamal(
        M, G, Q, 2, -1, 1, 17
    );

    const recuperado = decryptElGamal(
        C1, C2, G, d, -1, 1, 17
    );

    return C2 === null &&
           recuperado !== null &&
           recuperado[0] === 3 &&
           recuperado[1] === 12;
});

// Prueba 32: rechazar clave privada fuera de rango.
probar('ElGamal: rechazar clave privada inválida', () => {
    try {
        decryptElGamal(
            [13, 14], [0, 1], [0, 1],
            14, -1, 1, 17
        );
        return false;
    } catch (error) {
        return error instanceof RangeError;
    }
});

// Prueba 33: rechazar componente C1 inválida.
probar('ElGamal: rechazar C1 fuera de la curva', () => {
    try {
        decryptElGamal(
            [2, 2], [0, 1], [0, 1],
            3, -1, 1, 17
        );
        return false;
    } catch (error) {
        return error instanceof RangeError;
    }
});
// Prueba 34: protocolo completo.
probar('Massey-Omura: recupera el mensaje original', () => {
    const resultado = simulateMasseyOmura(
        [0, 1], 3, 9, -1, 1, 17
    );

    return resultado.N === 14 &&
           resultado.paso1[0] === 5 &&
           resultado.paso1[1] === 11 &&
           resultado.paso2[0] === 0 &&
           resultado.paso2[1] === 16 &&
           resultado.paso3[0] === 1 &&
           resultado.paso3[1] === 1 &&
           resultado.recuperado[0] === 0 &&
           resultado.recuperado[1] === 1;
});
// Prueba 35: inversos de los exponentes.
probar('Massey-Omura: inversos modulares correctos', () => {
    const resultado = simulateMasseyOmura(
        [0, 1], 3, 9, -1, 1, 17
    );

    return resultado.dA === 5 &&
           resultado.dB === 11 &&
           (resultado.eA * resultado.dA) % resultado.N === 1 &&
           (resultado.eB * resultado.dB) % resultado.N === 1;
});
// Prueba 36: rechazar exponente sin inverso.
probar('Massey-Omura: rechazar eA=2', () => {
    try {
        simulateMasseyOmura(
            [0, 1], 2, 9, -1, 1, 17
        );
        return false;
    } catch (error) {
        return error instanceof RangeError;
    }
});
// Prueba 37: rechazar exponentes decimales.
probar('Massey-Omura: rechazar eB decimal', () => {
    try {
        simulateMasseyOmura(
            [0, 1], 3, 9.5, -1, 1, 17
        );
        return false;
    } catch (error) {
        return error instanceof RangeError;
    }
});
// Prueba 38: rechazar mensaje inválido.
probar('Massey-Omura: rechazar punto fuera de la curva', () => {
    try {
        simulateMasseyOmura(
            [2, 2], 3, 9, -1, 1, 17
        );
        return false;
    } catch (error) {
        return error instanceof RangeError;
    }
});
        reporte += '\nRESULTADO: ' +
                   aprobadas + '/' + total +
                   ' pruebas aprobadas';

        salida.textContent = reporte;
    </script>
</body>
</html>
